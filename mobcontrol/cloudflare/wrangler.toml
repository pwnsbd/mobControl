name = "mobcontrol-relay"
main = "worker.mjs"
compatibility_date = "2026-04-07"
workers_dev = false
preview_urls = false

[assets]
directory = "../client"
binding = "CLIENT_ASSETS"
run_worker_first = true
html_handling = "none"

[[durable_objects.bindings]]
name = "MOBCONTROL_ROOMS"
class_name = "MobControlRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["MobControlRoom"]
