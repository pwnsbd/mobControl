<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#10151f">
  <title>Block Dodge</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; background:#10151f; color:#eef3fb; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px; background:radial-gradient(ellipse at 50% 0%, #202c40 0, #10151f 65%); }
    main { width:min(100%, 720px); }
    header { display:flex; justify-content:space-between; align-items:end; gap:16px; margin:0 0 14px; }
    h1 { font-size:clamp(1.55rem,4vw,2.2rem); margin:0; letter-spacing:-.04em; }
    .subtitle { color:#a8b5c9; margin:5px 0 0; font-size:.94rem; }
    .stats { display:flex; gap:20px; text-align:right; }
    .stat-label { color:#94a3b8; font-size:.72rem; letter-spacing:.08em; text-transform:uppercase; }
    .stat-value { font-variant-numeric:tabular-nums; font-size:1.35rem; font-weight:700; margin-top:2px; }
    .arena { position:relative; overflow:hidden; border:1px solid #334155; border-radius:16px; background:#0b1220; box-shadow:0 24px 70px #0006; }
    canvas { display:block; width:100%; height:auto; aspect-ratio: 16 / 10; }
    .overlay { position:absolute; inset:0; display:grid; place-items:center; padding:20px; background:#07101dcc; text-align:center; }
    .overlay[hidden] { display:none; }
    .card { max-width:360px; }
    .card h2 { font-size:1.8rem; margin:0 0 8px; }
    .card p { color:#c1ccdc; line-height:1.5; margin:0 0 18px; }
    button { border:0; border-radius:9px; padding:11px 17px; background:#62e6bc; color:#06231d; font:700 1rem inherit; font-weight:750; cursor:pointer; }
    button:hover { background:#8bf2d1; }
    button:focus-visible { outline:3px solid white; outline-offset:3px; }
    .controls { display:flex; align-items:center; justify-content:space-between; gap:14px; margin-top:13px; color:#a8b5c9; font-size:.9rem; }
    .phone-tools { margin-top:12px; display:flex; align-items:center; gap:12px; flex-wrap:wrap; color:#a8b5c9; font-size:.9rem; }
    #phone-status { color:#a8b5c9; }
    #qr { margin-top:12px; padding:12px; background:#fff; color:#111; overflow-wrap:anywhere; border-radius:10px; width:max-content; max-width:100%; }
    #qr img, #qr canvas { max-width:100%; }
    kbd { display:inline-block; min-width:27px; padding:3px 7px; border:1px solid #46546a; border-radius:5px; background:#1b2637; color:#eef3fb; text-align:center; font:600 .8rem ui-monospace,monospace; }
    @media(max-width:520px) { body{padding:14px} header{align-items:center} .stats{gap:12px}.controls{align-items:flex-start; flex-direction:column} }
    @media(prefers-reduced-motion:reduce) { * {scroll-behavior:auto} }
  </style>
</head>
<body>
  <main>
    <header>
      <div><h1>Block Dodge</h1><p class="subtitle">Keep moving. Make it to 30 seconds.</p></div>
      <div class="stats" aria-label="Game stats">
        <div><div class="stat-label">Time</div><div class="stat-value" id="time">30.0</div></div>
        <div><div class="stat-label">Dodged</div><div class="stat-value" id="score">0</div></div>
      </div>
    </header>
    <section class="arena" aria-label="Game area">
      <canvas id="game" width="800" height="500" role="img" aria-label="Move the teal player left and right to avoid falling orange blocks."></canvas>
      <div class="overlay" id="overlay">
        <div class="card">
          <h2 id="message">Ready?</h2>
          <p id="detail">Use the left and right arrow keys to dodge the falling blocks. Survive for 30 seconds.</p>
          <button id="start">Start game</button>
          <button id="use-keyboard" type="button" hidden>Continue with keyboard</button>
        </div>
      </div>
    </section>
    <div class="controls"><div><kbd>←</kbd> <kbd>→</kbd> Move <span aria-hidden="true">·</span> <kbd>Esc</kbd> Pause</div><button id="pause" type="button" disabled>Pause</button></div>
    <div class="phone-tools"><button id="connect-phone" type="button">Connect phone</button><button id="use-phone" type="button" hidden>Use phone steering</button><span id="phone-status" aria-live="polite">Keyboard steering is ready.</span></div>
    <div id="qr" aria-label="Phone pairing QR code" hidden></div>
    <p id="announcement" class="subtitle" aria-live="polite" style="position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0"></p>
  </main>
  <script type="module" src="./game.js"></script>
</body>
</html>
